name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Format
        shell: bash
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$files" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/erp-api
