# GitLab CI validates the canonical public GitHub ARIMA source.
# This is CI integration, not a repository mirror or deployment pipeline.

stages:
  - verify
  - test

variables:
  GIT_DEPTH: "1"
  GOTOOLCHAIN: "local"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

go-verify:
  stage: verify
  image: golang:1.26.11
  before_script:
    - set -eu
    - git clone --depth 1 --branch main https://github.com/nyeinpyaesone-ui/arima.git .canonical-source
    - cd .canonical-source
    - echo "Canonical source SHA: $(git rev-parse HEAD)"
    - echo "GitLab CI config SHA: ${CI_COMMIT_SHA}"
  script:
    - go mod download
    - go mod verify
    - test -z "$(gofmt -l ./cmd ./internal)"
    - go vet ./...
    - go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

go-test:
  stage: test
  image: golang:1.26.11
  before_script:
    - set -eu
    - git clone --depth 1 --branch main https://github.com/nyeinpyaesone-ui/arima.git .canonical-source
    - cd .canonical-source
    - echo "Canonical source SHA: $(git rev-parse HEAD)"
  script:
    - go test -race ./...

web-verify:
  stage: verify
  image: node:22-bookworm-slim
  before_script:
    - set -eu
    - git clone --depth 1 --branch main https://github.com/nyeinpyaesone-ui/arima.git .canonical-source
    - cd .canonical-source
    - echo "Canonical source SHA: $(git rev-parse HEAD)"
  script:
    - cd web
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm run build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .canonical-source/web/dist/
