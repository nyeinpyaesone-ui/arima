openapi: 3.1.0
info:
  title: ARIMA ERP Bridge API
  version: 0.1.0
  description: >
    Contract-first tenant-scoped ERP and AI integration boundary.
    Implemented routes are health probes, GET /api/v1/me, and tenant-authorized customer create/read operations. Resource/action routes below remain planned contracts.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      operationId: liveness
      security: []
      summary: Process liveness
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /health/ready:
    get:
      operationId: readiness
      security: []
      summary: Readiness probe
      description: Confirms process readiness and, when configured, PostgreSQL connectivity.
      responses:
        '200':
          description: Process and configured dependencies are ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/v1/me:
    get:
      operationId: currentIdentity
      summary: Return the authenticated subject and tenant
      description: Requires a valid OIDC JWT access token. Signature, issuer, audience, expiry and not-before are verified using provider discovery and JWKS. Returns 503 when authentication is not configured.
      responses:
        '200':
          description: Verified caller identity
          content:
            application/json:
              schema:
                type: object
                required: [subject, tenant_id]
                properties:
                  subject: { type: string }
                  tenant_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Authentication verifier is not configured
  /api/v1/customers:
    post:
      operationId: createCustomer
      summary: Create a customer within the authenticated tenant
      description: Requires customer.write permission. The customer record, audit event, idempotency response and outbox event are committed atomically. Replays with the same key and payload return the original result.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
        - in: header
          name: X-Request-ID
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
      responses:
        '201':
          description: Customer created or idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { description: Invalid request or customer data }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Request body exceeds 64 KiB }
        '415': { description: Content-Type must be application/json }
        '503': { description: Customer service is not configured }
  /api/v1/customers/{externalID}:
    get:
      operationId: getCustomer
      summary: Read a customer within the authenticated tenant
      description: Requires customer.read permission. Tenant context is derived from the verified token and enforced again by PostgreSQL RLS.
      parameters:
        - in: path
          name: externalID
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Customer service is not configured }
  /v1/resources/{type}/{id}:
    get:
      operationId: getResource
      summary: Planned tenant-scoped ERP resource read; not implemented
      parameters:
        - in: path
          name: type
          required: true
          schema: { type: string, enum: [customer, product, inventory, sales_order, purchase_order] }
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/actions:validate:
    post:
      operationId: validateAction
      summary: Planned action validation without mutation; not implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionInput' }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionValidation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/actions:
    post:
      operationId: proposeAction
      summary: Planned auditable action proposal; not implemented
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionInput' }
      responses:
        '201':
          description: Action proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/actions/{id}:
    get:
      operationId: getAction
      summary: Planned action status read; not implemented
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Action status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/actions/{id}:approve:
    post:
      operationId: approveAction
      summary: Planned approval route; not implemented
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200':
          description: Updated action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/actions/{id}:execute:
    post:
      operationId: executeAction
      summary: Planned approved-action execution; not implemented
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2 access token
  responses:
    Unauthorized: { description: Missing or invalid authentication }
    Forbidden: { description: Principal lacks tenant-scoped permission }
    NotFound: { description: Resource absent within authorized tenant scope }
    Conflict: { description: Idempotency conflict, stale version, or invalid state transition }
  schemas:
    Health:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string }
        service: { type: string }
        timestamp: { type: string, format: date-time }
    Resource:
      type: object
      required: [id, type, tenant_id, version, data]
      properties:
        id: { type: string }
        type: { type: string }
        tenant_id: { type: string }
        version: { type: string }
        data: { type: object, additionalProperties: true }
        updated_at: { type: string, format: date-time }
    CustomerCreate:
      type: object
      additionalProperties: false
      required: [external_id, name]
      properties:
        external_id: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        notes: { type: string, maxLength: 2000 }
    Customer:
      type: object
      required: [id, tenant_id, external_id, name, version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        external_id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        notes: { type: string }
        version: { type: integer, minimum: 1 }
    ActionInput:
      type: object
      required: [action_type, resource_type, resource_id, expected_version, payload, rationale]
      properties:
        action_type: { type: string, minLength: 1 }
        resource_type: { type: string }
        resource_id: { type: string, minLength: 1 }
        expected_version: { type: string, minLength: 1 }
        payload: { type: object, additionalProperties: true }
        rationale: { type: string, minLength: 3, maxLength: 2000 }
    ActionValidation:
      type: object
      required: [valid, errors, warnings, approval_required]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        approval_required: { type: boolean }
    Action:
      type: object
      required: [id, tenant_id, status, action_type, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        status:
          type: string
          enum: [proposed, requires_approval, approved, executing, succeeded, rejected, failed]
        action_type: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        result: { type: object, additionalProperties: true }
