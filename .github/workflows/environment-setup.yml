name: Environment Setup Preflight

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to validate (this workflow does not deploy)
        required: true
        type: choice
        options:
          - development
          - staging
          - production
        default: development

permissions:
  contents: read

concurrency:
  group: env-preflight-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    # Environment configuration is only read from the trusted main branch.
    # Feature branches are covered by normal pull-request CI.
    if: github.ref == 'refs/heads/main'
    name: Validate ${{ inputs.target }} environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    env:
      TARGET_ENV: ${{ inputs.target }}
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Validate planned OIDC configuration
        if: inputs.target != 'development'
        env:
          ARIMA_OIDC_ISSUER: ${{ vars.ARIMA_OIDC_ISSUER }}
          ARIMA_OIDC_AUDIENCE: ${{ vars.ARIMA_OIDC_AUDIENCE }}
          ARIMA_DATABASE_URL: ${{ secrets.ARIMA_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARIMA_OIDC_ISSUER" || {
            echo "::error::Configure environment variable ARIMA_OIDC_ISSUER in GitHub Environment '$TARGET_ENV'."
            exit 1
          }
          test -n "$ARIMA_OIDC_AUDIENCE" || {
            echo "::error::Configure environment variable ARIMA_OIDC_AUDIENCE in GitHub Environment '$TARGET_ENV'."
            exit 1
          }
          case "$ARIMA_OIDC_ISSUER" in
            https://*) ;;
            *) echo "::error::ARIMA_OIDC_ISSUER must use HTTPS."; exit 1 ;;
          esac
          test -n "$ARIMA_DATABASE_URL" || { echo "::error::Configure secret ARIMA_DATABASE_URL in the selected GitHub Environment."; exit 1; }
          python3 -c 'import os; from urllib.parse import parse_qs,urlparse; u=urlparse(os.environ["ARIMA_DATABASE_URL"]); assert u.scheme in ("postgres","postgresql") and u.hostname and parse_qs(u.query).get("sslmode")==["verify-full"], "ARIMA_DATABASE_URL must be a PostgreSQL URL using sslmode=verify-full"'
          echo "OIDC and PostgreSQL configuration shape passed; no secret values were printed."
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Verify module graph is clean
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$files" ]]; then printf 'Go files need gofmt:\n%s\n' "$files"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Unit tests with race detector
        run: go test -race ./...
      # PostgreSQL integration tests run in the main CI workflow with an isolated service.
      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -o /tmp/arima-api ./cmd/erp-api
      - name: Deployment boundary
        run: |
          echo "Preflight completed. No deployment, migration, or release was performed."
          echo "Production configuration shape was checked; no remote database connection or migration was performed."
          echo "Production promotion requires an independently approved deployment target and rollout/rollback procedure."
