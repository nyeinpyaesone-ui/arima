name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arima_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ARIMA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/arima_test?sslmode=disable
      ARIMA_TEST_RUNTIME_DATABASE_URL: postgres://arima_runtime:arima_test_password@localhost:5432/arima_test?sslmode=disable
      ARIMA_CUSTOMER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/arima_customer_test?sslmode=disable
      ARIMA_CUSTOMER_TEST_RUNTIME_DATABASE_URL: postgres://arima_customer_runtime:arima_customer_test_password@localhost:5432/arima_customer_test?sslmode=disable
      ARIMA_CUSTOMER_TEST_WORKER_DATABASE_URL: postgres://arima_outbox_runtime:arima_outbox_test_password@localhost:5432/arima_customer_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
      - name: Create isolated customer service integration database
        env:
          PGPASSWORD: postgres
        run: psql "$ARIMA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE arima_customer_test"
      - name: Validate local Compose and bootstrap scripts
        run: |
          sh -n scripts/migrate-local.sh
          bash -n scripts/env-preflight.sh
          docker compose --env-file configs/arima.env.example config --quiet
          docker compose --env-file configs/arima.env.example --env-file configs/arima.worker.env.example -f compose.yaml -f compose.worker.yaml config --quiet
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Verify module integrity and pinned graph
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        shell: bash
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$files" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Race and PostgreSQL integration tests
        run: go test -race -coverprofile=coverage.out ./...

  publish:
    name: Build and publish verified release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
      - name: Build Linux amd64 and arm64 binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -buildvcs=true -ldflags="-s -w" \
              -o "dist/arima-api-linux-$arch" ./cmd/erp-api
          done
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum arima-api-linux-* > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/arima-api-linux-*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/arima-api-linux-amd64 \
            dist/arima-api-linux-arm64 \
            dist/SHA256SUMS \
            --verify-tag --generate-notes
