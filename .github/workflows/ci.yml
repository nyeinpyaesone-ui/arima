name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arima_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ARIMA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/arima_test?sslmode=disable
      ARIMA_TEST_RUNTIME_DATABASE_URL: postgres://arima_runtime:arima_test_password@localhost:5432/arima_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Verify pinned Go module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format
        shell: bash
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$files" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        if: always()
        run: |
          if [[ -f coverage.out ]]; then
            go tool cover -func=coverage.out | tee coverage-summary.txt
          else
            echo "Coverage profile was not produced." | tee coverage-summary.txt
          fi
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/arima-api ./cmd/erp-api
