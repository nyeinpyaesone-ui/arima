name: Staging Container Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a non-publishing preview or request a staging rollout
        required: true
        type: choice
        default: preview
        options:
          - preview
          - deploy
      acknowledge:
        description: Explicitly authorize a staging-only rollout (required for deploy)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arima-staging-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy-staging:
    name: Build staging preview or deploy reviewed image
    if: >-
      inputs.mode == 'preview' ||
      (github.ref == 'refs/heads/main' &&
       inputs.mode == 'deploy' && inputs.acknowledge == true)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate staging adapter configuration
        if: inputs.mode == 'deploy'
        env:
          STAGING_DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
          STAGING_DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          STAGING_HEALTHCHECK_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_DEPLOY_HOOK_URL" || {
            echo "::error::Missing staging environment secret STAGING_DEPLOY_HOOK_URL."
            exit 1
          }
          test -n "$STAGING_DEPLOY_TOKEN" || {
            echo "::error::Missing staging environment secret STAGING_DEPLOY_TOKEN."
            exit 1
          }
          test -n "$STAGING_HEALTHCHECK_URL" || {
            echo "::error::Missing staging environment variable STAGING_HEALTHCHECK_URL."
            exit 1
          }
          case "$STAGING_DEPLOY_HOOK_URL" in
            https://*) ;;
            *) echo "::error::STAGING_DEPLOY_HOOK_URL must use HTTPS."; exit 1 ;;
          esac
          case "$STAGING_HEALTHCHECK_URL" in
            https://*) ;;
            *) echo "::error::STAGING_HEALTHCHECK_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.mode == 'deploy'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-architecture image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.mode == 'deploy' }}
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: ${{ inputs.mode == 'deploy' }}
          provenance: mode=max

      - name: Report non-publishing staging preview
        if: inputs.mode == 'preview'
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Staging preview build succeeded."
          echo "Source commit: $GITHUB_SHA"
          echo "Image target (not published): $IMAGE_REF"
          echo "Platforms: linux/amd64, linux/arm64"
          echo "No registry push, deployment request, migration, or production action was performed."

      - name: Validate published image digest
        if: inputs.mode == 'deploy'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo "::error::Build did not return a valid sha256 image digest."; exit 1 ;;
          esac

      - name: Request staging rollout of exact image digest
        if: inputs.mode == 'deploy'
        env:
          STAGING_DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
          STAGING_DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          IMAGE_REF: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg image "$IMAGE_REF" \
            --arg digest "$IMAGE_DIGEST" \
            --arg commit "$GITHUB_SHA" \
            '{
              image:$image,
              digest:$digest,
              commit:$commit,
              environment:"staging",
              services:[
                {
                  name:"api",
                  entrypoint:["/erp-api"],
                  port:8080,
                  environment:{ARIMA_ENV:"production",ARIMA_ADDR:":8080"},
                  required_environment:["ARIMA_OIDC_ISSUER","ARIMA_OIDC_AUDIENCE","ARIMA_DATABASE_URL"]
                },
                {
                  name:"outbox-worker",
                  entrypoint:["/outbox-worker"],
                  port:8081,
                  environment:{ARIMA_ENV:"production",ARIMA_OUTBOX_HEALTH_ADDR:":8081"},
                  required_environment:["ARIMA_OUTBOX_DATABASE_URL","ARIMA_OUTBOX_WEBHOOK_URL","ARIMA_OUTBOX_WEBHOOK_TOKEN"]
                }
              ],
              readiness:{all_services:true,timeout_seconds:300,private_worker_probe:"/health/ready"}
            }')"

          # Never follow redirects: do not forward the bearer token to another host.
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 --max-redirs 0 \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer ${STAGING_DEPLOY_TOKEN}" \
            --data "$payload" \
            "$STAGING_DEPLOY_HOOK_URL")"
          case "$status" in
            2??) echo "Staging adapter accepted the rollout request (HTTP $status)." ;;
            *) echo "::error::Staging adapter rejected the rollout request (HTTP $status)."; exit 1 ;;
          esac

      - name: Verify exact staging release and both services
        if: inputs.mode == 'deploy'
        env:
          STAGING_HEALTHCHECK_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "$STAGING_HEALTHCHECK_URL" -o /tmp/arima-staging-health.json; then
              if jq -e \
                --arg digest "$IMAGE_DIGEST" \
                --arg commit "$GITHUB_SHA" \
                '.digest == $digest and .commit == $commit and .api.status == "ready" and .worker.status == "ready"' \
                /tmp/arima-staging-health.json >/dev/null; then
                echo "The requested image digest and commit are running; API and worker report ready."
                exit 0
              fi
            fi
            echo "Staging verification attempt ${attempt}/30 has not passed."
            sleep 10
          done
          echo "::error::Staging did not confirm the exact release and both services within five minutes."
          echo "::error::Deployment is not considered successful. Follow the provider's tested rollback procedure."
          exit 1

      - name: State deployment boundary
        if: always()
        run: |
          echo "This workflow is staging-only."
          echo "Preview mode does not publish or deploy."
          echo "Deploy mode does not run database migrations or deploy production."
